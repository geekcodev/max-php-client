name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  quality:
    name: Lint, static analysis, tests and coverage
    runs-on: ubuntu-latest
    env:
      IMAGE: ghcr.io/geekcodev/php:8.4-bookworm
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Cache Composer dependencies
        uses: actions/cache@v4
        with:
          path: vendor
          key: ${{ runner.os }}-composer-${{ hashFiles('composer.json') }}
          restore-keys: ${{ runner.os }}-composer-

      - name: Install dependencies
        run: docker run --rm -v "$PWD":/var/www/html -w /var/www/html "$IMAGE" composer install --no-interaction --prefer-dist

      - name: Check code style
        run: docker run --rm -v "$PWD":/var/www/html -w /var/www/html "$IMAGE" composer run lint

      - name: Static analysis
        run: docker run --rm -v "$PWD":/var/www/html -w /var/www/html "$IMAGE" composer run analyse

      - name: Run tests and coverage gate
        run: docker run --rm -e XDEBUG_MODE=coverage -v "$PWD":/var/www/html -w /var/www/html "$IMAGE" composer run coverage

  integration:
    name: Integration smoke tests
    runs-on: ubuntu-latest
    if: ${{ secrets.MAX_API_TOKEN != '' }}
    env:
      IMAGE: ghcr.io/geekcodev/php:8.4-bookworm
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: docker run --rm -v "$PWD":/var/www/html -w /var/www/html "$IMAGE" composer install --no-interaction --prefer-dist

      - name: Run integration tests
        run: docker run --rm -e MAX_API_TOKEN="${{ secrets.MAX_API_TOKEN }}" -v "$PWD":/var/www/html -w /var/www/html "$IMAGE" vendor/bin/phpunit --group integration
